name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The base path is the PUBLIC one served by the nginx reverse proxy, not the
      # /<repo> path GitHub Pages serves the files under, so it is pinned here rather than
      # taken from actions/configure-pages (which would also rewrite next.config.ts).
      # See DEPLOYMENT.md.
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: /tvmjs
          SITE_URL: https://walletadapter.org/tvmjs
          # Repository or organisation variable (not a secret — the ID is public in the page
          # HTML). Unset means no analytics.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
