packages:
  - 'site'
  - 'docs'

# pnpm 11 blocks dependency lifecycle scripts unless listed here, and `pnpm install`
# exits 1 until every ignored package has an explicit decision. All false: the build
# does not need any of these — esbuild and unrs-resolver ship prebuilt binaries, and
# the rest only print funding notices.
allowBuilds:
  core-js: false
  esbuild: false
  unrs-resolver: false
  sharp: false

# braces has no patched release; it is only reached through @next/eslint-plugin-next at lint
# time. Remove once a fixed braces ships and `pnpm audit` is re-checked.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# Security overrides. pnpm >= 11 no longer reads `pnpm.overrides` from package.json;
# this is the supported location. See https://pnpm.io/settings
#
# Each entry pins a transitive dependency past a published advisory. Re-check with
# `pnpm audit` and drop an entry once the direct dependency ships the fix itself.
overrides:
  # VitePress 1.6.3 declares vite ^5.4.14, and Vite 5 pins esbuild 0.21, which carries
  # open advisories. Vite 7 is the highest major VitePress 1.x still builds cleanly on:
  # it pulls a patched esbuild 0.25+ and is still Rollup-based, whereas Vite 8 switches
  # to Rolldown and floods the docs build with plugin-compatibility warnings.
  vite: '7.3.7'

  # VitePress 1.6.3 bundles its own markdown-it typings, while vitepress-plugin-group-icons
  # types its plugin against @types/markdown-it. 14.2.0 added `utils.isPunctCharCode`, which
  # the bundled copy does not have, so the two MarkdownIt types stopped being assignable and
  # `md.use(groupIconMdPlugin)` fails to typecheck. Pinned to the last compatible release;
  # drop this once VitePress ships typings built against markdown-it 14.2.
  '@types/markdown-it': '14.1.2'

  # ReDoS / stack-exhaustion advisories in minimatch's brace expansion, pulled in by
  # eslint (1.x line) and typescript-eslint (5.x line). Patch bumps within each major.
  'brace-expansion@^1': '1.1.21'
  'brace-expansion@^5': '5.0.12'

  # postcss (under vite) still resolves the vulnerable source-map-js 1.2.1.
  'source-map-js': '1.2.2'

  # @tailwindcss/typography 0.5.20 hard-pins postcss-selector-parser 6.0.10; the
  # quadratic-parse fix only exists in 7.1.6+. 7.x dropped old Node versions but kept
  # the API typography uses. Drop this once typography moves to 7.x itself.
  '@tailwindcss/typography>postcss-selector-parser': '7.1.7'

  # @next/eslint-plugin-next (every release through 16.5 canary) pins fast-glob 3.3.1,
  # whose micromatch -> braces <=3.0.3 has a stack-exhaustion advisory with no patched
  # braces release. The plugin only calls `globSync(pattern, { onlyDirectories: true })`
  # (utils/get-root-dirs.js), which tinyglobby implements with the same signature and
  # no braces dependency. Drop this once the plugin moves off fast-glob.
  '@next/eslint-plugin-next>fast-glob': 'npm:tinyglobby@0.2.17'
